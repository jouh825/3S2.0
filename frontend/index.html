<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧路線規劃系統</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glass-bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-shell">
    <!-- 左側控制面板 -->
    <div class="glass-panel control-panel">
      <div class="app-header">
        <div class="app-logo">🗺️</div>
        <div>
          <h1>智慧路線規劃</h1>
          <p class="subtitle">Smart Route Planner</p>
        </div>
      </div>

      <p class="notice">💡 輸入您的起終點與特殊需求，AI 將為您推薦最佳出行方案。</p>

      <div class="card-glass input-group">
        <h3>📍 行程設定</h3>
        <label>
          起點位置
          <input type="text" id="start-point" placeholder="例如：台北車站">
        </label>
        <label style="margin-top: 10px;">
          目的地
          <input type="text" id="end-point" placeholder="例如：松山文創園區">
        </label>
      </div>

      <div class="card-glass input-group">
        <h3>💬 AI 需求微調</h3>
        <label>
          請描述您的狀況或偏好
          <textarea id="user-prompt" rows="3" placeholder="例如：今天穿高跟鞋腳痛，希望能少走路..."></textarea>
        </label>
      </div>

      <button id="search-btn" class="primary-btn">開始規劃路線</button>
    </div>

    <!-- 右側地圖與成果面板 (解除高度限制) -->
    <div class="map-panel">
      <!-- 地圖區域 -->
      <div id="map"></div>

      <!-- 成果與 AI 說明區 -->
      <div class="results">
        <div class="results-header">
          <h2>🏆 推薦路線 (不同工具排序前 3 名)</h2>
          <div id="weather-info" class="weather-box"></div>
        </div>

        <!-- AI 解讀 (自然展開不限制) -->
        <div class="reasoning-box">
          <span class="ai-badge">GEMINI 同理心解讀</span>
          <p id="reasoning">請輸入起終點並點擊規劃按鈕...</p>
        </div>

        <!-- 路線卡片區 (完整展示) -->
        <div id="routes-container" class="routes-container"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
